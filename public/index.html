<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
:root{--p:#00C896;--pd:#00a07a;--bg:#0e1a16;--card:#111f18;--card2:#192820;--border:rgba(0,200,150,0.18);--text:#e8f5ef;--text2:#7aaa90;--text3:#4a7a60;--red:#ff4d6d;--yellow:#FFD93D;--info:#4A90A4;--radius:18px;}
body.light{--bg:#F4FBF8;--card:#ffffff;--card2:#f5f9f7;--border:rgba(74,144,164,0.2);--text:#0D2B20;--text2:#5a8a7a;--text3:#9ab8b0;}
body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text);height:100dvh;overflow:hidden;font-size:14px;transition:background .3s,color .3s;}
.screen{position:absolute;inset:0;display:none;flex-direction:column;overflow:hidden;background:var(--bg);}
.screen.active{display:flex;}
@keyframes floatA{0%,100%{transform:translateY(0) rotate(0deg)}50%{transform:translateY(-16px) rotate(5deg)}}
@keyframes floatB{0%,100%{transform:translateY(0) rotate(0deg)}50%{transform:translateY(-22px) rotate(-6deg)}}
@keyframes floatC{0%,100%{transform:translateY(0) rotate(0deg)}50%{transform:translateY(-12px) rotate(8deg)}}
@keyframes ecgDraw{0%{stroke-dashoffset:300}100%{stroke-dashoffset:0}}
.ecg-stroke{stroke-dasharray:300;stroke-dashoffset:300;animation:ecgDraw 2s linear infinite;}
@keyframes hb{0%,100%{transform:scale(1)}14%{transform:scale(1.12)}28%{transform:scale(1)}42%{transform:scale(1.08)}70%{transform:scale(1)}}
.heartbeat{animation:hb 1.5s ease-in-out infinite;}
@keyframes tdot{0%,80%,100%{transform:scale(0)}40%{transform:scale(1)}}
.tdot{animation:tdot 1.4s infinite ease-in-out both;width:4px;height:4px;border-radius:50%;background:var(--p);display:inline-block;margin:0 1px;}
.tdot:nth-child(1){animation-delay:-.32s}.tdot:nth-child(2){animation-delay:-.16s}
@keyframes msgIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.msg-in{animation:msgIn .3s ease-out;}
@keyframes wave{0%,100%{scaleY(0.4)}50%{scaleY(1)}}
.mood-btn{transition:.2s;cursor:pointer;}
.mood-btn:active{transform:scale(.85);}
.msg-wrap{position:relative;-webkit-user-select:none;user-select:none;}
.msg-reactions{position:absolute;top:-36px;left:50%;transform:translateX(-50%);background:var(--card);border:1px solid var(--border);border-radius:50px;padding:4px 8px;display:flex;gap:6px;box-shadow:0 4px 20px rgba(0,0,0,.3);z-index:10;white-space:nowrap;}
.drawer{position:absolute;left:0;top:0;bottom:0;width:280px;background:var(--card);border-right:1px solid var(--border);z-index:30;transform:translateX(-100%);transition:.35s cubic-bezier(.4,0,.2,1);display:flex;flex-direction:column;}
.drawer.open{transform:translateX(0);}
.overlay{position:absolute;inset:0;background:rgba(0,0,0,.55);z-index:29;opacity:0;pointer-events:none;transition:.3s;}
.overlay.open{opacity:1;pointer-events:all;}
.toggle{width:44px;height:24px;border-radius:12px;background:var(--card2);border:1px solid var(--border);position:relative;cursor:pointer;transition:.3s;}
.toggle.on{background:var(--p);}
.tknob{position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:var(--text2);transition:.3s;}
.toggle.on .tknob{left:23px;background:#fff;}
.chip{padding:.4rem .9rem;background:var(--card);border:1px solid var(--border);border-radius:50px;font-size:12px;color:var(--text2);cursor:pointer;white-space:nowrap;transition:.15s;}
.chip:active{background:rgba(0,200,150,.15);border-color:var(--p);color:var(--p);}
.tab-bar{display:flex;background:var(--card);border-top:1px solid var(--border);}
.tab{flex:1;padding:.6rem .25rem;display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer;font-size:10px;color:var(--text3);transition:.2s;}
.tab.active{color:var(--p);}
.tab-dot{width:4px;height:4px;border-radius:50%;background:var(--p);opacity:0;}
.tab.active .tab-dot{opacity:1;}
@keyframes barGrow{from{transform:scaleY(0)}to{transform:scaleY(1)}}
.bar{transform-origin:bottom;animation:barGrow .6s ease-out forwards;}
@keyframes voiceWave{0%,100%{height:4px}50%{height:20px}}
.vbar{width:3px;border-radius:2px;background:var(--p);animation:voiceWave .5s ease-in-out infinite;}
.vbar:nth-child(2){animation-delay:.1s}.vbar:nth-child(3){animation-delay:.2s}.vbar:nth-child(4){animation-delay:.15s}.vbar:nth-child(5){animation-delay:.05s}
::-webkit-scrollbar{width:3px;}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px;}
.glass{background:rgba(255,255,255,.08);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);}
body.light .glass{background:rgba(255,255,255,.85);}
.badge-red{background:rgba(255,77,109,.15);color:#ff4d6d;border:1px solid rgba(255,77,109,.3);}
.badge-yellow{background:rgba(255,215,61,.15);color:#c8920a;border:1px solid rgba(255,215,61,.3);}
.badge-green{background:rgba(0,200,150,.15);color:#00C896;border:1px solid rgba(0,200,150,.3);}
textarea,input,select{background:var(--card2)!important;border:1px solid var(--border);border-radius:14px;color:var(--text)!important;font-family:'DM Sans',sans-serif;outline:none;caret-color:var(--p);}
textarea:focus,input:focus,select:focus{border-color:var(--p);}
input:-webkit-autofill,input:-webkit-autofill:hover,input:-webkit-autofill:focus{-webkit-box-shadow:0 0 0 1000px var(--card2) inset!important;-webkit-text-fill-color:var(--text)!important;}
.summary-card{background:linear-gradient(135deg,rgba(0,200,150,.12),rgba(74,144,164,.08));border:1px solid var(--border);border-radius:20px;padding:1rem;}
.mood-emoji{font-size:28px;transition:.2s;cursor:pointer;}
.mood-emoji.selected{transform:scale(1.3);filter:drop-shadow(0 0 8px rgba(0,200,150,.6));}
.modal-bg{position:absolute;inset:0;background:rgba(0,0,0,.6);z-index:40;display:flex;align-items:flex-end;}
.modal-sheet{background:var(--card);border-radius:24px 24px 0 0;padding:1.5rem;width:100%;}
.graph-container{overflow-x:auto;padding-bottom:.5rem;}
@media(min-width:768px){#auth{flex-direction:row;}.auth-panel-left{flex:1;display:flex;flex-direction:column;justify-content:center;padding:3rem;}.auth-panel-right{width:380px;background:linear-gradient(160deg,#0e2a20,#0a1f18);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:2rem;border-left:1px solid var(--border);}body.light #auth .auth-panel-right{background:linear-gradient(160deg,#e0f0ea,#c5e5d8);}}
.header-strip{height:20px;width:100%;background-repeat:repeat-x;background-size:80px 20px;opacity:.15;pointer-events:none;}
@keyframes pulse-ring{0%{transform:scale(1);opacity:1}100%{transform:scale(2);opacity:0}}
.voice-ring{position:absolute;inset:-4px;border-radius:50%;border:2px solid var(--p);animation:pulse-ring 1.5s ease-out infinite;}
.profile-card{background:var(--card);border:1px solid var(--border);border-radius:20px;padding:1.25rem;margin-bottom:.75rem;}
.reminder-item{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:.75rem 1rem;display:flex;align-items:center;gap:12px;margin-bottom:.5rem;}
.map-placeholder{background:var(--card2);border:1px dashed var(--border);border-radius:16px;height:200px;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:8px;}
@keyframes spin{to{transform:rotate(360deg)}}
.spinner{width:16px;height:16px;border:2px solid currentColor;border-top-color:transparent;border-radius:50%;animation:spin 1s linear infinite;display:inline-block;}
.urgency-red{border-left:4px solid #ff4d6d !important;}
.urgency-yellow{border-left:4px solid #FFD93D !important;}
.urgency-green{border-left:4px solid #00C896 !important;}
.tts-btn{width:24px;height:24px;border-radius:50%;background:var(--card2);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;cursor:pointer;transition:.2s;}
.tts-btn:hover{background:var(--p);color:#0a1a10;}
.qr-placeholder{width:120px;height:120px;background:var(--card2);border:1px solid var(--border);border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:48px;}
[dir="rtl"] .drawer{left:auto;right:0;transform:translateX(100%);}
[dir="rtl"] .drawer.open{transform:translateX(0);}
@media(max-width:767px){.auth-panel-right{display:none !important;}}
</style>
</head>

function matchConditions(text){
  const normalize=s=>s.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
  const low=normalize(text);
  const words=low.split(/[\s,;.!?]+/).filter(w=>w.length>2);
  const scored=MEDICAL_KNOWLEDGE.conditions.map(c=>{
    let s=0;
    // Each symptom match: exact phrase = 10pts, word overlap = 3pts
    c.symptoms.forEach(sym=>{
      const sl=normalize(sym);
      if(low.includes(sl)){s+=10;}
      else{
        const symWords=sl.split(' ');
        symWords.forEach(sw=>{if(sw.length>3&&words.some(w=>w.includes(sw)||sw.includes(w)))s+=3;});
      }
    });
    // Red flag match = strong signal
    c.redFlags.forEach(rf=>{
      const rfl=normalize(rf);
      if(low.includes(rfl))s+=20;
      else{rfl.split(' ').forEach(rw=>{if(rw.length>3&&words.some(w=>w===rw))s+=6;});}
    });
    return {...c,score:s};
  });
  // Higher threshold + require at least 2 distinct symptom matches
  const relevant=scored.filter(c=>c.score>=14).sort((a,b)=>b.score-a.score);
  // Never return more than 3, and top result must have significantly higher score
  if(relevant.length===0)return[];
  const top=relevant[0];
  return relevant.filter((c,i)=>i===0||(c.score>=10&&c.score>=top.score*0.4)).slice(0,3);
}

const ThemeCtx=createContext({dark:true,toggle:()=>{}});
function ThemeProvider({children}){
  const[dark,setDark]=useState(()=>{try{return JSON.parse(localStorage.getItem('mt_dark'))!==false;}catch{return true;}});
  useEffect(()=>{document.body.classList.toggle('light',!dark);localStorage.setItem('mt_dark',JSON.stringify(dark));},[dark]);
  return <ThemeCtx.Provider value={{dark,toggle:()=>setDark(d=>!d)}}>{children}</ThemeCtx.Provider>;
}

// ── Backend API base URL (change to your deployed server URL in production) ──
const API = window.location.hostname === 'localhost' ? 'http://localhost:5000/api' : window.location.origin + '/api';

// ── Generic API helper ───────────────────────────────────────────────────────
async function apiFetch(path, options = {}) {
  const res = await fetch(API + path, {
    credentials: 'include',        // send HttpOnly cookie automatically
    headers: { 'Content-Type': 'application/json', ...(options.headers || {}) },
    ...options,
    body: options.body ? (typeof options.body === 'string' ? options.body : JSON.stringify(options.body)) : undefined,
  });
  const data = await res.json();
  if (!res.ok) throw new Error(data.error || 'Erreur serveur');
  return data;
}

const AuthCtx=createContext(null);
function AuthProvider({children}){
  const[user,setUser]=useState(()=>{try{return JSON.parse(localStorage.getItem('mt_user'))||null;}catch{return null;}});
  const[history,setHistory]=useState([]);
  const[mood,setMoodData]=useState([]);
  const[reminders,setReminders]=useState([]);
  const[profile,setProfile]=useState({name:'',age:'',sex:'',bloodType:'',allergies:'',conditions:''});

  // ── Login / logout ──
  const login=(u)=>{setUser(u);localStorage.setItem('mt_user',JSON.stringify(u));};
  const logout=async()=>{
    try{await apiFetch('/auth/logout',{method:'POST'});}catch{}
    setUser(null);localStorage.removeItem('mt_user');
  };

  // ── Sync from backend on mount if user exists ──
  useEffect(()=>{
    if(!user||user.isGuest)return;
    apiFetch('/chat/history').then(setHistory).catch(()=>{});
    apiFetch('/mood').then(setMoodData).catch(()=>{});
    apiFetch('/reminders').then(setReminders).catch(()=>{});
    apiFetch('/profile').then(d=>setProfile(d.profile||{})).catch(()=>{});
  },[user?.id]);

  // ── History ──
  const addHistory=(e)=>{
    if(!user||user.isGuest)return;
    apiFetch('/chat/history',{method:'POST',body:e}).catch(()=>{});
    setHistory(prev=>[{...e,date:new Date().toISOString(),id:Date.now()},...prev].slice(0,100));
  };

  // ── Mood ──
  const addMood=(entry)=>{
    if(user&&!user.isGuest){
      apiFetch('/mood',{method:'POST',body:entry}).catch(()=>{});
    }
    setMoodData(prev=>[{...entry,date:new Date().toISOString()},...prev].slice(0,90));
  };

  // ── Reminders ──
  const addReminder=async(r)=>{
    if(user&&!user.isGuest){
      try{const saved=await apiFetch('/reminders',{method:'POST',body:r});setReminders(prev=>[saved,...prev]);return;}catch{}
    }
    setReminders(prev=>[{...r,id:Date.now(),active:true},...prev]);
  };
  const toggleReminder=async(id)=>{
    if(user&&!user.isGuest){
      try{const updated=await apiFetch(`/reminders/${id}/toggle`,{method:'PATCH'});setReminders(prev=>prev.map(r=>r._id===id||r.id===id?updated:r));return;}catch{}
    }
    setReminders(prev=>prev.map(r=>r.id===id?{...r,active:!r.active}:r));
  };
  const removeReminder=async(id)=>{
    if(user&&!user.isGuest){try{await apiFetch(`/reminders/${id}`,{method:'DELETE'});}catch{}}
    setReminders(prev=>prev.filter(r=>r._id!==id&&r.id!==id));
  };

  // ── Profile ──
  const saveProfile=async(p)=>{
    setProfile(p);
    if(user&&!user.isGuest){try{await apiFetch('/profile',{method:'PUT',body:p});}catch{}}
  };

  // ── Share ──
  const toggleShare=async(chatId)=>{
    try{
      const res=await apiFetch('/chat/share',{method:'POST',body:{chatId}});
      const hashUrl=res.shareUrl?res.shareUrl.replace('/share/','/').replace('http://localhost:5000',''):'';const fullUrl=hashUrl?`${window.location.origin}/#/share/${res.shareId}`:'';return{enabled:res.shareEnabled,url:fullUrl||res.shareUrl};
    }catch{return{enabled:false,url:''};}
  };

  return <AuthCtx.Provider value={{user,login,logout,history,addHistory,mood,addMood,reminders,addReminder,toggleReminder,removeReminder,profile,saveProfile,toggleShare}}>{children}</AuthCtx.Provider>;
}

// QCM WIDGET
// ═══════════════════════════════════════════════════════════════
function QCMWidget({onDone,lang}){
  const[step,setStep]=useState(0);
  const[answers,setAnswers]=useState({});
  const qcms=[
    {q:tk('qcmPain',lang),opts:['Tete','Gorge','Poitrine','Abdomen','Dos','Membres','Aucune']},
    {q:tk('qcmDuration',lang),opts:['< 24h','1-3 jours','1 semaine','1+ mois']},
    {q:tk('qcmFever',lang),opts:['Legere (37-38C)','Elevee (+38C)','Non','Je ne sais pas']},
    {q:tk('qcmHistory',lang),opts:['Diabete','Hypertension','Asthme','Maladies cardiaques','Aucun','Je ne sais pas']},
  ];
  const toggle=(val)=>{
    const cur=answers[step]||[];
    setAnswers({...answers,[step]:cur.includes(val)?cur.filter(v=>v!==val):[...cur,val]});
  };
  const next=()=>{
    if(step<qcms.length-1)setStep(s=>s+1);
    else{const summary=Object.values(answers).flat().join(', ');onDone(summary||'non precises');}
  };
  const qcm=qcms[step];
  const sel=answers[step]||[];
  return(
    <div className="msg-in" style={{background:'var(--card)',border:'1px solid var(--border)',borderRadius:20,padding:'1rem',marginBottom:12,maxWidth:'90%'}}>
      <p style={{fontSize:11,color:'var(--p)',fontWeight:600,marginBottom:4}}>Question {step+1}/{qcms.length}</p>
      <div style={{width:'100%',background:'var(--card2)',borderRadius:8,height:4,marginBottom:12}}><div style={{background:'var(--p)',height:4,borderRadius:8,transition:'all .3s',width:`${((step+1)/qcms.length)*100}%`}}/></div>
      <p style={{fontSize:13,fontWeight:600,color:'var(--text)',marginBottom:12}}>{qcm.q}</p>
      <div style={{display:'flex',flexWrap:'wrap',gap:8,marginBottom:16}}>
        {qcm.opts.map(o=>{
          const selected=sel.includes(o);
          return <button key={o} onClick={()=>toggle(o)} style={{padding:'6px 14px',borderRadius:50,border:'1px solid',fontSize:12,background:selected?'var(--p)':'var(--card2)',color:selected?'#0a1a10':'var(--text2)',borderColor:selected?'var(--p)':'var(--border)',cursor:'pointer',transition:'.15s'}}>{o}</button>;
        })}
      </div>
      <div style={{display:'flex',justifyContent:'space-between',alignItems:'center'}}>
        <button onClick={()=>onDone('libre')} style={{fontSize:11,color:'var(--text3)',background:'none',border:'none',textDecoration:'underline',cursor:'pointer'}}>{tk('writeInstead',lang)}</button>
        <button onClick={next} style={{fontSize:12,background:'var(--p)',color:'#0a1a10',border:'none',borderRadius:12,padding:'8px 18px',fontWeight:600,cursor:'pointer'}}>{step<qcms.length-1?tk('next',lang):tk('analyze',lang)}</button>
      </div>
    </div>
  );
}

function Message({msg,onReact,onSpeak,lang,isSpeaking,user}){
  const[isPressed,setIsPressed]=useState(false);
  const[showReactions,setShowReactions]=useState(false);
  const pressTimer=useRef(null);
  const isUser=msg.role==='user';
  const urgencyClass=msg.urgency?`urgency-${msg.urgency}`:'';

  const handleTouchStart=()=>{
    if(isUser)return;
    pressTimer.current=setTimeout(()=>{setShowReactions(true);},600);
  };
  const handleTouchEnd=()=>{
    clearTimeout(pressTimer.current);

// SESSION SUMMARY CARD
// ═══════════════════════════════════════════════════════════════
function SessionSummary({messages,onClose,lang}){
  const{user,addHistory}=useContext(AuthCtx);
  const symptoms=messages.filter(m=>m.role==='user').map(m=>m.text).join('; ');
  const aiResponses=messages.filter(m=>m.role==='ai');
  const lastAI=aiResponses[aiResponses.length-1];
  const conditions=lastAI?.conditions||[];
  const topCondition=conditions[0];
  const urgency=topCondition?SEV[topCondition.severity]:null;

  const exportPDF=()=>{
    if(!window.jspdf)return;
    const{jsPDF}=window.jspdf;
    const doc=new jsPDF();
    doc.setFont('helvetica','bold');doc.setFontSize(18);
    doc.text('MediAssist AI - Rapport Medical',14,20);
    doc.setFont('helvetica','normal');doc.setFontSize(10);
    doc.text(`Date: ${new Date().toLocaleDateString('fr-FR')}`,14,30);
    doc.text(`Patient: ${user?.name||'Anonyme'}`,14,36);
    let y=48;
    doc.setFont('helvetica','bold');doc.text('SYMPTOMES:',14,y);y+=8;
    doc.setFont('helvetica','normal');
    const symLines=doc.splitTextToSize(symptoms||'Non specifies',170);
    doc.text(symLines,14,y);y+=symLines.length*5+8;
    if(topCondition){
      doc.setFont('helvetica','bold');doc.text('CONDITION PROBABLE:',14,y);y+=8;
      doc.setFont('helvetica','normal');
      doc.text(`${topCondition.name} (${topCondition.severity.toUpperCase()})`,14,y);y+=12;
      doc.setFont('helvetica','bold');doc.text('ACTIONS IMMEDIATES:',14,y);y+=8;
      doc.setFont('helvetica','normal');
      topCondition.immediateActions.forEach((a,i)=>{doc.text(`${i+1}. ${a}`,14,y);y+=6;});
      y+=4;
      doc.setFont('helvetica','bold');doc.text('MEDICAMENTS:',14,y);y+=8;
      doc.setFont('helvetica','normal');
      topCondition.medications.forEach(m=>{const lines=doc.splitTextToSize(`${m.name}: ${m.dosage}`,170);doc.text(lines,14,y);y+=lines.length*5+2;});
    }
    y+=8;
    doc.setFont('helvetica','bold');doc.setTextColor(255,0,0);
    doc.text('AVERTISSEMENT: Cet assistant ne remplace pas une consultation medicale.',14,y);
    doc.setTextColor(0,0,0);
    doc.save('mediassist-rapport.pdf');
  };

  return(
    <div className="modal-bg" onClick={onClose}>
      <div className="modal-sheet" onClick={e=>e.stopPropagation()}>
        <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:16}}>
          <h3 style={{fontSize:16,fontWeight:700,color:'var(--text)'}}>{tk('sessionSummary',lang)}</h3>
          <button onClick={onClose} style={{background:'none',border:'none',fontSize:20,cursor:'pointer',color:'var(--text3)'}}>✕</button>
        </div>
        <div className="summary-card" style={{marginBottom:12}}>
          <div style={{marginBottom:12}}>
            <p style={{fontSize:11,color:'var(--text3)',marginBottom:4}}>{tk('symptoms',lang)}</p>
            <p style={{fontSize:13,color:'var(--text)'}}>{symptoms||'Non specifies'}</p>
          </div>
          {topCondition&&(
            <>
              <div style={{marginBottom:12}}>
                <p style={{fontSize:11,color:'var(--text3)',marginBottom:4}}>{tk('probableCondition',lang)}</p>
                <p style={{fontSize:14,fontWeight:700,color:'var(--text)'}}>{topCondition.name}</p>
              </div>
              <div style={{marginBottom:12}}>
                <p style={{fontSize:11,color:'var(--text3)',marginBottom:4}}>{tk('urgency',lang)}</p>
                <span className={urgency?.badge} style={{fontSize:12,fontWeight:700,padding:'4px 12px',borderRadius:20,display:'inline-block'}}>{urgency?.label}</span>
              </div>
              <div>
                <p style={{fontSize:11,color:'var(--text3)',marginBottom:4}}>{tk('actions',lang)}</p>
                {topCondition.immediateActions.slice(0,3).map((a,i)=>(
                  <p key={i} style={{fontSize:12,color:'var(--text2)',marginBottom:2}}>{i+1}. {a}</p>
                ))}
              </div>
            </>
          )}
        </div>
        <div style={{display:'flex',gap:8}}>
          <button onClick={exportPDF} style={{flex:1,padding:12,background:'var(--p)',color:'#0a1a10',border:'none',borderRadius:14,fontWeight:600,cursor:'pointer',fontSize:13}}>📄 {tk('export',lang)} PDF</button>
          <button onClick={onClose} style={{flex:1,padding:12,background:'var(--card2)',color:'var(--text)',border:'1px solid var(--border)',borderRadius:14,fontWeight:600,cursor:'pointer',fontSize:13}}>{tk('close',lang)}</button>
        </div>
      </div>
    </div>
  );
}

// VOICE RECORDER
// ═══════════════════════════════════════════════════════════════
function VoiceRecorder({onTranscript,lang}){
  const[isRecording,setIsRecording]=useState(false);
  const[transcript,setTranscript]=useState('');
  const recognitionRef=useRef(null);

  useEffect(()=>{
    if('webkitSpeechRecognition' in window||'SpeechRecognition' in window){
      const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
      recognitionRef.current=new SR();
      recognitionRef.current.continuous=true;
      recognitionRef.current.interimResults=true;
      recognitionRef.current.lang=lang==='fr'?'fr-FR':lang==='en'?'en-US':'ar-SA';
      recognitionRef.current.onresult=(e)=>{
        let final='';
        for(let i=e.resultIndex;i<e.results.length;i++){
          if(e.results[i].isFinal)final+=e.results[i][0].transcript;
        }
        if(final){setTranscript(prev=>prev+final);}
      };
      recognitionRef.current.onerror=(e)=>{console.error('Speech error',e);setIsRecording(false);};
      recognitionRef.current.onend=()=>{if(isRecording)recognitionRef.current.start();};
    }
  },[lang]);

  const startRecording=()=>{
    if(!recognitionRef.current){alert('Reconnaissance vocale non supportee');return;}
    setTranscript('');
    setIsRecording(true);
    recognitionRef.current.start();
  };

  const stopRecording=()=>{
    setIsRecording(false);
    if(recognitionRef.current)recognitionRef.current.stop();
    if(transcript)onTranscript(transcript);
  };

  return(
    <div style={{position:'relative'}}>
      {isRecording&&(
        <div style={{position:'absolute',bottom:'100%',left:'50%',transform:'translateX(-50%)',marginBottom:8,background:'var(--card)',border:'1px solid var(--border)',borderRadius:16,padding:'8px 16px',display:'flex',alignItems:'center',gap:8,boxShadow:'0 4px 20px rgba(0,0,0,.3)',whiteSpace:'nowrap',zIndex:20}}>
          <div style={{display:'flex',alignItems:'center',gap:3}}>
            {[1,2,3,4,5].map(i=><div key={i} className="vbar" style={{height:16}}/>)}
          </div>
          <span style={{fontSize:12,color:'var(--text2)'}}>{tk('recording',lang)}</span>
          <span style={{fontSize:11,color:'var(--text3)'}}>{transcript}</span>
        </div>
      )}
      <button
        onMouseDown={startRecording}
        onMouseUp={stopRecording}
        onTouchStart={startRecording}
        onTouchEnd={stopRecording}
        style={{width:44,height:44,borderRadius:'50%',background:isRecording?'var(--red)':'var(--card2)',border:'1px solid var(--border)',display:'flex',alignItems:'center',justifyContent:'center',cursor:'pointer',position:'relative'}}
      >
        {isRecording&&<div className="voice-ring"/>}
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke={isRecording?'#fff':'var(--text2)'} strokeWidth="2"><path d="M12 2a3 3 0 0 1 3 3v7a3 3 0 0 1-6 0V5a3 3 0 0 1 3-3Z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="23"/><line x1="8" y1="23" x2="16" y2="23"/></svg>
      </button>
    </div>
  );
}

// MAIN CHAT SCREEN
// ═══════════════════════════════════════════════════════════════
function ChatScreen({lang,setLang}){
  const{user,logout,addHistory,profile}=useContext(AuthCtx);
  const{dark,toggle}=useContext(ThemeCtx);
  const[messages,setMessages]=useState([]);
  const[input,setInput]=useState('');
  const[isLoading,setIsLoading]=useState(false);
  const[showQCM,setShowQCM]=useState(false);
  const[drawerOpen,setDrawerOpen]=useState(false);
  const[showSummary,setShowSummary]=useState(false);
  const[showShare,setShowShare]=useState(false);
  const[showProfile,setShowProfile]=useState(false);
  const[showHistory,setShowHistory]=useState(false);
  const[showMood,setShowMood]=useState(false);
  const[showReminders,setShowReminders]=useState(false);
  const[showPharmacy,setShowPharmacy]=useState(false);
  const[showCertif,setShowCertif]=useState(false);
  const[subScreen,setSubScreen]=useState(null);
  const[speakingId,setSpeakingId]=useState(null);
  const[chatId]=useState(()=>'chat_'+Date.now());
  const messagesEndRef=useRef(null);
  const inputRef=useRef(null);
  const fileRef=useRef(null);
  const synthRef=useRef(null);

  useEffect(()=>{messagesEndRef.current?.scrollIntoView({behavior:'smooth'});},[messages,isLoading]);

  useEffect(()=>{
    setTimeout(()=>{
      addMsg('ai',tk('welcome',lang));
      setShowQCM(true);
    },400);
  },[lang]);

  const addMsg=(role,text,extra={})=>{
    const msg={id:Date.now()+Math.random(),role,text,time:new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'}),reactions:[],...extra};
    setMessages(prev=>[...prev,msg]);
    return msg.id;
  };

  const patientCtx=profile&&(profile.age||profile.weight||profile.conditions)?
    `\nPROFIL PATIENT : Nom: ${profile.name||user?.name||'inconnu'}, Age: ${profile.age||'?'} ans, Poids: ${profile.weight||'?'} kg, Sexe: ${profile.sex||'?'}, Groupe sanguin: ${profile.bloodType||'?'}, Allergies: ${profile.allergies||'aucune connue'}, Maladies chroniques: ${profile.conditions||'aucune'}, Localisation: ${profile.location||'?'}.
Adapte TOUJOURS tes recommandations (medicaments, dosages) a l'age et au poids du patient. Appelle le patient par son prenom si disponible.`:'';

  const SYSTEM_PROMPT=`Si l'utilisateur demande une explication ou des informations generales sur une maladie (ex: "c'est quoi", "explique", "parle moi de", "informations sur", "qu'est ce que"), reponds UNIQUEMENT avec une explication claire : definition, causes, symptomes, traitement. Pas de pourcentages, pas de conditions, pas de questions de suivi.

Tu es MediAssist, un assistant medical IA precis et direct. Reponds TOUJOURS en ${lang==='fr'?'francais':lang==='en'?'anglais':'arabe'}.
${patientCtx}

══════════════════════════════════════
FORMAT DE REPONSE — OBLIGATOIRE
══════════════════════════════════════

▌ CAS 1 — DESCRIPTION DE SYMPTOMES (premiere fois) :
Analyse les symptomes et reponds EXACTEMENT dans ce format :

🔴/🟡/🟢 [MALADIE PRINCIPALE] — [X]%
→ Pourquoi : [raison medicale precise en 1 phrase]
[Medicament: nom + dosage exact adapte au profil patient OU "adapter selon age/poids"]
[Quand consulter : regle concrete]

🟡/🟢 [MALADIE 2] — [X]%
→ Pourquoi : [raison en 1 phrase]
[Medicament si applicable]
[Quand consulter]

🟢 [MALADIE 3 si pertinente] — [X]%
→ Pourquoi : [raison en 1 phrase]

🚨 Urgence si : [signe d alarme specifique]
⚠️ Consultez un medecin pour confirmation.

REGLES COULEURS : 🔴 = critique/urgence vitale | 🟡 = consultation recommandee | 🟢 = bénin/domicile
REGLES POURCENTAGES : total doit faire ~100%. Ne mets QUE les maladies VRAIMENT liees aux symptomes decrits. JAMAIS une maladie sans lien avec les symptomes.

▌ CAS 2 — "est-ce grave ?" ou question sur gravite :
Reponds pour CHAQUE maladie proposee :
• Si c est [maladie 1] → [grave/pas grave + pourquoi en 1 phrase]
• Si c est [maladie 2] → [grave/pas grave + pourquoi en 1 phrase]
Termine par le signe d alarme principal.

▌ CAS 3 — "quels medicaments ?" :
${patientCtx?`Profil detecte — donne dosage EXACT adapte. Pour chaque maladie probable :`:`Profil non renseigne — donne medicament et indique "adapter selon age/poids". Pour chaque maladie probable :`}
• [Maladie] → [Medicament] [dosage] [frequence] ([durée])

▌ CAS 4 — "quand consulter ?" :
• Si [maladie 1] → [regle concrete : delai + condition]
• Si [maladie 2] → [regle concrete]

▌ CAS 5 — "premiers secours ?" :
Etapes numerotees, maximum 5, courtes.

▌ CAS 6 — SANS SYMPTOMES :
Repondre uniquement : "Decrivez vos symptomes pour que je puisse vous aider."

▌ CAS 7 — QUESTION DE SUIVI (hors ci-dessus) :
Repondre directement en max 3 lignes. Ne jamais re-expliquer ce qui a deja ete dit.

INTERDIT : Repeter les symptomes du patient | Commencer par "Bonjour" ou formules de politesse | Donner des maladies sans lien avec les symptomes | Depasser 8 lignes sauf cas 1`;

  const sendToAI=async(userText,imageData=null)=>{
    setIsLoading(true);
    const matches=matchConditions(userText);
    const topMatch=matches[0];
    const urgency=topMatch?SEV[topMatch.severity]?.urgency:null;

    try{
      let reply='';
      if(imageData){
        // Extract base64 data from dataURL (strip "data:image/jpeg;base64," prefix)
        const [meta,base64]=imageData.split(',');
        const mediaType=meta.match(/:(.*?);/)?.[1]||'image/jpeg';
        const data=await apiFetch('/chat/image',{method:'POST',body:{base64,mediaType,lang,chatId}});
        reply=data.reply||'';
      }else{
        const apiMessages=[
          ...messages.filter(m=>m.role!=='ai'||!m.conditions).slice(-6).map(m=>({
            role:m.role==='ai'?'assistant':'user',
            content:m.text
          })),
          {role:'user',content:userText}
        ];
        const data=await apiFetch('/chat',{method:'POST',body:{messages:apiMessages,system:SYSTEM_PROMPT,lang,chatId}});
        reply=data.reply||'';
      }
      setIsLoading(false);
      const wordCount=userText.trim().split(/\s+/).length;
      const hasRealSymptoms=wordCount>=4&&matches.length>0&&!['non precises','non précises','pas de symptomes','rien'].some(s=>userText.toLowerCase().includes(s));
      // Extract percentages mentioned by AI and attach to matched conditions
      let enrichedMatches=matches;
      if(hasRealSymptoms&&reply){
        const pctRegex=/([A-Za-zÀ-ÿ\/\- ]{3,40})\s*[—\-–]?\s*(\d{1,3})%/g;
        let m;const aiMentioned=[];
        while((m=pctRegex.exec(reply))!==null){aiMentioned.push({name:m[1].trim().toLowerCase(),pct:parseInt(m[2])});}
        if(aiMentioned.length>0){
          enrichedMatches=matches.map(cond=>{
            const normalize=s=>s.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'');
            const condNorm=normalize(cond.name);
            const found=aiMentioned.find(ai=>condNorm.includes(normalize(ai.name))||normalize(ai.name).includes(condNorm.split(/[/ ]/)[0]));
            return found?{...cond,probability:found.pct}:cond;
          });
          // Also add AI-mentioned diseases not in knowledge base matches (fallback card)
        }
      }
      addMsg('ai',reply,{conditions:hasRealSymptoms?enrichedMatches:null,urgency:hasRealSymptoms?urgency:null});
      addHistory({symptoms:userText,conditions:matches.map(c=>c.name),response:reply,chatId});
    }catch(e){
      setIsLoading(false);
      const fallbackReply=topMatch?generateFallbackReply(topMatch,lang):`Je n'ai pas pu me connecter a l'IA. Voici une analyse locale basee sur vos symptomes.

${matches.map((c,i)=>`${i+1}. ${c.name} (${SEV[c.severity]?.label})`).join('\n')}

⚠️ ${tk('disclaimerFull',lang)}`;
      addMsg('ai',fallbackReply,{conditions:matches.length>0?matches:null,urgency});
    }
  };

  const generateFallbackReply=(condition,lang)=>{
    const cfg=SEV[condition.severity];
    return `${condition.name} - ${cfg.label}

${condition.explanation}

Actions immediates :
${condition.immediateActions.map((a,i)=>`${i+1}. ${a}`).join('\n')}

Medicaments :
${condition.medications.filter(m=>!m.name.includes('AUCUN')).map(m=>`• ${m.name}: ${m.dosage}`).join('\n')}

Signaux d alarme :
${condition.redFlags.map(rf=>`• ${rf}`).join('\n')}

${condition.recommendation}

⚠️ ${tk('disclaimerFull',lang)}`;
  };

  const handleSend=async()=>{
    const text=input.trim();if(!text)return;
    setInput('');setShowQCM(false);
    addMsg('user',text);
    await sendToAI(text);
  };

  const handleQCMDone=async(summary)=>{
    setShowQCM(false);
    if(summary==='libre'){inputRef.current?.focus();return;}
    const text=`Mes symptomes : ${summary}`;
    addMsg('user',text);
    await sendToAI(text);
  };

  const handleImage=(e)=>{
    const file=e.target.files?.[0];if(!file)return;
    const reader=new FileReader();
    reader.onload=async(ev)=>{
      const dataUrl=ev.target.result;
      addMsg('user',`📷 Image medicale : ${file.name}`,{image:dataUrl});
      const imagePrompt=lang==='en'
        ?'Analyze this medical image carefully. Describe what you observe, the most likely condition with probability percentage, and recommended action. After your analysis, ask 2-3 targeted follow-up questions to better assess the situation (duration, pain level, associated symptoms, any treatment tried).'
        :lang==='ar'
        ?'حلل هذه الصورة الطبية بعناية. صف ما تلاحظه، الحالة الأرجح مع نسبة مئوية، والإجراء الموصى به. بعد تحليلك، اطرح 2-3 أسئلة متابعة محددة لتقييم الوضع بشكل أفضل.'
        :'Analyse cette image medicale avec precision. Decris ce que tu observes, la condition la plus probable avec pourcentage, et l action recommandee. Apres ton analyse, pose 2-3 questions de suivi ciblées pour mieux evaluer la situation (duree, niveau de douleur, symptomes associes, traitement deja essaye).';
      await sendToAI(imagePrompt,dataUrl);
    };
    reader.readAsDataURL(file);
  };

  const handleReact=(msgId,action,value)=>{
    setMessages(prev=>prev.map(m=>{
      if(m.id!==msgId)return m;
      if(action==='expand')return{...m,expanded:value};
      if(action==='copy'){navigator.clipboard?.writeText(m.text);alert('Texte copie !');return m;}
      return{...m,reactions:[...(m.reactions||[]),action]};
    }));
  };

  const handleSpeak=(msgId,text)=>{
    if(speakingId===msgId){
      window.speechSynthesis?.cancel();
      setSpeakingId(null);
      return;
    }
    if('speechSynthesis' in window){
      window.speechSynthesis.cancel();
      const utter=new SpeechSynthesisUtterance(text);
      utter.lang=lang==='fr'?'fr-FR':lang==='en'?'en-US':'ar-SA';
      utter.rate=.9;
      utter.onend=()=>setSpeakingId(null);
      window.speechSynthesis.speak(utter);
      setSpeakingId(msgId);
    }
  };

  const handleVoiceTranscript=(text)=>{
    setInput(prev=>prev+(prev?' ':'')+text);
    inputRef.current?.focus();
  };

  const exportPDF=()=>{
    if(!window.jspdf)return;
    const{jsPDF}=window.jspdf;
    const doc=new jsPDF();
    doc.setFont('helvetica','bold');doc.setFontSize(16);
    doc.text('MediAssist AI - Rapport',14,20);
    doc.setFont('helvetica','normal');doc.setFontSize(10);
    doc.text(`Date: ${new Date().toLocaleDateString()}`,14,30);
    let y=42;
    messages.forEach(m=>{
      if(y>270){doc.addPage();y=20;}
      doc.setFont('helvetica','bold');
      doc.text(m.role==='user'?'Patient:':'Assistant:',14,y);
      doc.setFont('helvetica','normal');
      const lines=doc.splitTextToSize(m.text,170);
      doc.text(lines,14,y+6);y+=8+lines.length*5;
    });
    doc.save('mediassist-consultation.pdf');
  };

  const QUICK_REPLIES=[tk('quickMeds',lang),tk('quickSerious',lang),tk('quickWhen',lang),tk('quickFirstAid',lang)];

  if(subScreen==='profile')return<ProfileScreen onBack={()=>setSubScreen(null)} lang={lang}/>;
  if(subScreen==='history')return<HistoryScreen onBack={()=>setSubScreen(null)} lang={lang} onSelectChat={(h)=>{setMessages([{id:Date.now(),role:'user',text:h.symptoms||'',time:'',reactions:[]},{id:Date.now()+1,role:'ai',text:h.response||'',time:h.date?new Date(h.date).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'}):'',reactions:[]}]);setSubScreen(null);}}/>;
  if(subScreen==='mood')return<MoodTrackerScreen onBack={()=>setSubScreen(null)} lang={lang}/>;
  if(subScreen==='reminders')return<RemindersScreen onBack={()=>setSubScreen(null)} lang={lang}/>;
  if(subScreen==='pharmacy')return<PharmacyFinderScreen onBack={()=>setSubScreen(null)} lang={lang} type="pharmacy"/>;
  if(subScreen==='clinic')return<PharmacyFinderScreen onBack={()=>setSubScreen(null)} lang={lang} type="clinic"/>;

  return(
    <div className="screen active" style={{background:'var(--bg)'}}>
      {/* Drawer */}
      <div className={drawerOpen?'overlay open':'overlay'} onClick={()=>setDrawerOpen(false)}/>
      <div className={drawerOpen?'drawer open':'drawer'}>
        <div style={{padding:'2.5rem 1.25rem 1rem',borderBottom:'1px solid var(--border)'}}>
          <div style={{display:'flex',alignItems:'center',gap:12,marginBottom:12}}>
            <div style={{width:44,height:44,borderRadius:'50%',background:'var(--p)',display:'flex',alignItems:'center',justifyContent:'center',fontSize:18,fontWeight:700,color:'#0a1a10'}}>{user?.name?.[0]||'G'}</div>
            <div>
              <p style={{fontSize:14,fontWeight:700,color:'var(--text)'}}>{user?.name||'Visiteur'}</p>
              <p style={{fontSize:11,color:'var(--text3)'}}>{user?.isGuest?'Mode invite':user?.email}</p>
            </div>
          </div>
          <div style={{display:'flex',gap:6}}>
            {['🫀','🩺','🧬','💊','🦠'].map((ic,i)=><div key={i} style={{width:28,height:28,borderRadius:8,background:'rgba(0,200,150,.1)',display:'flex',alignItems:'center',justifyContent:'center',fontSize:14}}>{ic}</div>)}
          </div>
        </div>
        <div style={{flex:1,overflowY:'auto',padding:'.75rem'}}>
          <p style={{fontSize:10,color:'var(--text3)',textTransform:'uppercase',letterSpacing:1,padding:'8px 8px 4px',fontWeight:600}}>{tk('language',lang)}</p>
          <div style={{display:'flex',gap:6,padding:'0 8px 12px'}}>
            {['fr','en','ar'].map(l=>{
              const labels={fr:'🇫🇷 Français',en:'🇬🇧 English',ar:'🇩🇿 العربية'};
              return<button key={l} onClick={()=>{setLang(l);setDrawerOpen(false);}} style={{flex:1,padding:'6px 4px',borderRadius:10,border:'1px solid',borderColor:lang===l?'var(--p)':'var(--border)',background:lang===l?'rgba(0,200,150,.1)':'transparent',color:lang===l?'var(--p)':'var(--text3)',fontSize:11,cursor:'pointer'}}>{labels[l]}</button>;
            })}
          </div>
          <div style={{padding:'0 8px'}}>
            <button onClick={()=>{toggle();setDrawerOpen(false);}} style={{width:'100%',display:'flex',alignItems:'center',gap:12,padding:'10px 8px',borderRadius:12,background:'none',border:'none',color:'var(--text)',cursor:'pointer',fontSize:13}}>

          </div>
          <div style={{height:1,background:'var(--border)',margin:'8px 12px'}}/>
          {[
            {icon:'💬',label:tk('newConsult',lang),action:()=>{setMessages([]);setShowQCM(false);setDrawerOpen(false);setTimeout(()=>{addMsg('ai',tk('welcome',lang));},200);}},
            {icon:'📋',label:tk('history',lang),action:()=>{setSubScreen('history');setDrawerOpen(false);}},
            {icon:'📄',label:tk('exportPDF',lang),action:()=>{exportPDF();setDrawerOpen(false);}},

            {icon:'💊',label:tk('medReminders',lang),action:()=>{setSubScreen('reminders');setDrawerOpen(false);}},
            {icon:'📍',label:tk('findClinic',lang),action:()=>{setSubScreen('clinic');setDrawerOpen(false);}},

              <span style={{width:32,height:32,borderRadius:10,background:'rgba(0,200,150,.1)',display:'flex',alignItems:'center',justifyContent:'center',fontSize:16}}>{item.icon}</span>

        <div style={{flex:1,display:'flex',flexDirection:'column',alignItems:'center'}}>

      {/* Disclaimer Banner */}
      <div style={{background:'rgba(0,200,150,.06)',borderBottom:'1px solid var(--border)',padding:'6px 1rem',display:'flex',alignItems:'center',gap:8}}>

      </div>

      {/* Messages */}
      <div style={{flex:1,overflowY:'auto',padding:'1rem',display:'flex',flexDirection:'column'}}>
        {messages.map(msg=>{
          const isUser=msg.role==='user';
          const cfg=msg.urgency?SEV[Object.keys(SEV).find(k=>SEV[k].urgency===msg.urgency)||'moderee']:null;
          return(
            <div key={msg.id} className="msg-in" style={{display:'flex',flexDirection:isUser?'row-reverse':'row',alignItems:'flex-end',gap:8,marginBottom:12}}>
              <div style={{width:28,height:28,borderRadius:'50%',background:isUser?'var(--p)':'rgba(0,200,150,.15)',display:'flex',alignItems:'center',justifyContent:'center',fontSize:12,fontWeight:700,color:isUser?'#0a1a10':'var(--p)',flexShrink:0}}>
                {isUser?(user?.name?.[0]||'V'):'🩺'}
              </div>
              <div style={{maxWidth:'78%'}}>
                <div style={{background:isUser?'var(--p)':'var(--card)',border:'1px solid',borderColor:isUser?'var(--p)':'var(--border)',borderRadius:18,borderBottomRightRadius:isUser?4:18,borderBottomLeftRadius:isUser?18:4,padding:'10px 14px',color:isUser?'#0a1a10':'var(--text)',fontSize:13,lineHeight:1.6,position:'relative',borderLeft:cfg&&!isUser?`4px solid ${cfg.color}`:'none'}}>
                  {msg.text.split('\n').map((line,i)=><p key={i} style={{margin:i>0?'4px 0 0 0':0}}>{line}</p>)}
                  {msg.image&&<img src={msg.image} alt="Medical" style={{maxWidth:'100%',borderRadius:12,marginTop:8}}/>}
                  {msg.conditions?.length>0&&(
                    <div style={{marginTop:10}}>
                      <p style={{fontSize:11,color:'var(--p)',fontWeight:600,marginBottom:6}}>🔍 Conditions probables :</p>
                      {msg.conditions.map((c,i)=>{
                        const sevCfg=SEV[c.severity];
                        return(
                          <div key={c.id} style={{background:'var(--card2)',border:'1px solid var(--border)',borderRadius:12,padding:10,marginBottom:6}}>
                            <div style={{display:'flex',alignItems:'center',gap:6,marginBottom:4}}>
                              <span className={sevCfg.badge} style={{fontSize:9,fontWeight:700,padding:'2px 8px',borderRadius:20}}>{sevCfg.label}</span>
                              <span style={{fontSize:12,fontWeight:700,color:'var(--text)'}}>{c.name}</span>
                            </div>
                            <p style={{fontSize:11,color:'var(--text2)',lineHeight:1.5}}>{c.explanation}</p>
                          </div>
                        );
                      })}
                    </div>
                  )}
                  <div style={{display:'flex',alignItems:'center',gap:6,marginTop:6}}>
                    <span style={{fontSize:10,color:'var(--text3)'}}>{msg.time}</span>
                    {!isUser&&(
                      <button onClick={()=>handleSpeak(msg.id,msg.text)} style={{width:20,height:20,borderRadius:'50%',background:'var(--card2)',border:'1px solid var(--border)',display:'flex',alignItems:'center',justifyContent:'center',cursor:'pointer',fontSize:10}}>
                        {speakingId===msg.id?'⏹️':'🔊'}
                      </button>
                    )}
                    {msg.reactions?.length>0&&(
                      <div style={{display:'flex',gap:2}}>
                        {msg.reactions.map((r,i)=><span key={i} style={{fontSize:12}}>{r==='like'?'👍':r==='copy'?'📋':r==='warn'?'⚠️':r==='save'?'🔖':r}</span>)}
                      </div>
                    )}
                  </div>
                </div>
              </div>
            </div>
          );
    })}
    {showQCM&&messages.length>0&&<QCMWidget onDone={handleQCMDone} lang={lang}/>}
    {isLoading&&<TypingIndicator/>}
    {!isLoading&&messages.length>1&&!showQCM&&(
      <div style={{display:'flex',gap:8,flexWrap:'wrap',marginTop:4,marginBottom:8,paddingLeft:36}}>
        {QUICK_REPLIES.map(q=>(
          <button key={q} onClick={()=>{addMsg('user',q);sendToAI(q);}} style={{padding:'6px 14px',background:'var(--card)',border:'1px solid var(--border)',borderRadius:50,fontSize:11,color:'var(--p)',cursor:'pointer',transition:'.15s'}}>
            {q}
          </button>
        ))}
      </div>
    )}
    <div ref={messagesEndRef}/>
  </div>

  {/* Input Bar */}
  <div style={{padding:'.75rem 1rem',borderTop:'1px solid var(--border)',background:'var(--card)',display:'flex',alignItems:'flex-end',gap:8}}>
    <input ref={fileRef} type="file" accept="image/*" className="hidden" onChange={handleImage} style={{display:'none'}}/>
    <button onClick={()=>fileRef.current?.click()} style={{width:40,height:40,borderRadius:14,background:'var(--card2)',border:'1px solid var(--border)',display:'flex',alignItems:'center',justifyContent:'center',cursor:'pointer',flexShrink:0}}>
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="var(--text2)" strokeWidth="2"><rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>
    </button>

    <textarea
      ref={inputRef}
      value={input}
      onChange={e=>setInput(e.target.value)}
      onKeyDown={e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();handleSend();}}}
      placeholder={tk('placeholder',lang)}
      rows={1}
      style={{flex:1,resize:'none',background:'var(--card2)',border:'1px solid var(--border)',borderRadius:18,padding:'10px 14px',fontSize:13,color:'var(--text)',maxHeight:100,minHeight:40,overflowY:'auto'}}
    />
    <button onClick={handleSend} disabled={isLoading||!input.trim()} style={{width:40,height:40,borderRadius:14,background:'var(--p)',border:'none',display:'flex',alignItems:'center',justifyContent:'center',cursor:'pointer',flexShrink:0,opacity:isLoading||!input.trim()?.5:1}}>
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#0a1a10" strokeWidth="2.5"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22,2 15,22 11,13 2,9 22,2"/></svg>
    </button>
  </div>

  {/* Modals */}
  {showSummary&&<SessionSummary messages={messages} onClose={()=>setShowSummary(false)} lang={lang}/>}
  {showShare&&<ShareModal chatId={chatId} onClose={()=>setShowShare(false)} lang={lang}/>}
</div>
);
}

function ProfileSetupScreen({onDone,lang}){

          <div>
            <label style={lbl}>Âge</label>
            <input style={inp} type="number" value={form.age} onChange={e=>set('age',e.target.value)} placeholder="Ex: 30"/>

          <div>
            <label style={lbl}>Poids (kg)</label>

              <option value="F">Femme</option>
              <option value="O">Autre</option>

              <option value="">-- Choisir --</option>

            </select>
          </div>
          <div style={{gridColumn:'1/-1'}}>
            <label style={lbl}>Ville / Localisation</label>
            <input style={inp} value={form.location} onChange={e=>set('location',e.target.value)} placeholder="Ex: Alger, Oran, Sétif..."/>

            <label style={lbl}>Allergies connues</label>

  );

    fetch(`/api/chat/share/${shareId}`)
      .then(r=>r.json())

      .catch(()=>setErr('Erreur de chargement.'));

  if(err)return(
    <div style={{minHeight:'100vh',background:'#0a1a10',display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',color:'#e0ffe8',fontFamily:'DM Sans,sans-serif',gap:16}}>

        <div style={{width:36,height:36,background:'#00C896',borderRadius:'50%',display:'flex',alignItems:'center',justifyContent:'center',fontSize:18}}>❤️</div>
        <div style={{flex:1}}>
          <div style={{fontWeight:700,fontSize:16,color:'#e0ffe8'}}>MediAssist AI</div>
          <div style={{fontSize:11,color:'#7ec8a0'}}>Consultation de {data.patientName||'Anonyme'} · {new Date(data.createdAt).toLocaleDateString('fr-FR',{day:'numeric',month:'long',year:'numeric'})}</div>
        </div>
        <a href="/" style={{padding:'8px 16px',background:'#00C896',color:'#0a1a10',borderRadius:10,fontSize:12,fontWeight:700,textDecoration:'none'}}>Ouvrir l'app →</a>
      </div>
      <div style={{flex:1,overflowY:'auto'}}><div style={{maxWidth:680,margin:'0 auto',padding:'20px 16px'}}>
        <div style={{background:'#0d2018',border:'1px solid #1e3d2a',borderRadius:12,padding:14,marginBottom:20,fontSize:12,color:'#7ec8a0'}}>
          ⚠️ Consultation partagée à titre indicatif. Ne remplace pas un avis médical professionnel.
        </div>
        {data.messages.map((m,i)=>(
          <div key={i} style={{display:'flex',justifyContent:m.role==='user'?'flex-end':'flex-start',marginBottom:12}}>
            <div style={{maxWidth:'80%',padding:'12px 16px',borderRadius:18,background:m.role==='user'?'#00C896':'#1a2e20',color:m.role==='user'?'#0a1a10':'#e0ffe8',fontSize:13,lineHeight:1.6,whiteSpace:'pre-wrap'}}>
              {m.text}
              <div style={{fontSize:10,opacity:.6,marginTop:4,textAlign:'right'}}>{m.time||''}</div>
            </div>
          </div>
        ))}
      </div></div>
    </div>
  );
}

function AppInner({screen,setScreen,lang,setLang,onFinishOnboarding,onAuth}){
const{user}=useContext(AuthCtx);

// Check for shared chat link: /#/share/:id
const hash=window.location.hash;
const shareMatch=hash.match(/^#\/share\/(.+)$/);
if(shareMatch)return<SharedChatView shareId={shareMatch[1]}/>;

useEffect(()=>{
if(user&&screen==='auth')setScreen('chat');
if(!user&&screen==='chat')setScreen('auth');
},[user,screen]);

if(screen==='onboarding')return<OnboardingScreen onDone={onFinishOnboarding}/>;
if(screen==='auth'||!user)return<AuthScreen onSuccess={onAuth} lang={lang} setLang={setLang}/>;
if(screen==='profile')return<ProfileSetupScreen onDone={()=>setScreen('chat')} lang={lang}/>;
return<ChatScreen lang={lang} setLang={setLang}/>;
}

function App(){
const[screen,setScreen]=useState(()=>localStorage.getItem('mt_seen')?(JSON.parse(localStorage.getItem('mt_user')||'null')?'chat':'auth'):'onboarding');
const[lang,setLang]=useState('fr');
const finishOnboarding=()=>{localStorage.setItem('mt_seen','1');setScreen('auth');};
const handleAuth=(target)=>setScreen(target||'chat');
return<AppInner screen={screen} setScreen={setScreen} lang={lang} setLang={setLang} onFinishOnboarding={finishOnboarding} onAuth={handleAuth}/>;
}

const root=ReactDOM.createRoot(document.getElementById('root'));
root.render(
<ThemeProvider>
  <AuthProvider>
    <App/>
  </AuthProvider>
</ThemeProvider>
);
</script>
</body>
</html>
